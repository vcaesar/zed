# Built-in defaults. Overridden by ./conf/zed.toml in the working directory, then by non-empty environment variables.
#
# No built-in admin credentials: set both on first start via ./conf/zed.toml or the environment.
# zed_first_admin_user = ""
# zed_first_admin_password = ""
zed_server_port = "4080"
zed_server_mode = "node"
zed_node_id = 1
zed_data_path = "./data"
zed_metadata_storage = "bolt"
zed_ice_compressor = "zstd"
# 
# zed_sentry = true
# zed_sentry_dsn = ""
# zed_profiler = false
# zed_profiler_server = ""
# zed_profiler_api_key = ""
# zed_telemetry = true
# 
zed_prometheus_enable = false
zed_enable_text_keyword_mapping = false
# Accept MySQL CREATE TABLE schemas in mappings.sql; JSON mappings are always supported.
zed_enable_sql_mappings = true
# 
zed_batch_size = 1024
zed_max_results = 10000
zed_aggregation_terms_size = 1000
zed_max_document_size = 1000000
# Local disk LRU cache for indexes on object storage (s3/minio/gcs/oss), kept under <zed_data_path>/objcache. 0 disables.
zed_object_cache_size = 10737418240
zed_wal_sync_interval = 1000000000
zed_wal_redolog_no_sync = false
zed_swagger_enable = true
zed_log_level = "debug"

[Cluster]
zed_cluster_name = "ZincCluster"
zed_cluster_enable = false
zed_cluster_node_id = ""
zed_cluster_advertise_addr = ""
zed_cluster_partitions = 256
zed_cluster_heartbeat_interval = 5000000000
zed_cluster_heartbeat_ttl = 15000000000
zed_cluster_replicas = 1

[Tier]
zed_tier_enable = false
zed_tier_check_interval = 600000000000
zed_tier_cold_storage_type = "s3"

[Shard]
zed_shard_goroutine_num = 3
zed_shard_num = 3
zed_shard_max_size = 1073741824

[Etcd]
zed_etcd_prefix = "/zinc"

[S3]
# Object store for indexes created with storage_type = "s3" (MinIO or any S3-compatible endpoint works).
zed_s3_endpoint = "s3.amazonaws.com"
zed_s3_bucket = ""
zed_s3_region = ""
zed_s3_access_key_id = ""
zed_s3_secret_access_key = ""
zed_s3_use_ssl = true

[GCS]
# Google Cloud Storage for indexes created with storage_type = "gcs", via the S3-interoperable API (HMAC keys).
zed_gcs_endpoint = "storage.googleapis.com"
zed_gcs_bucket = ""
zed_gcs_access_key_id = ""
zed_gcs_secret_access_key = ""

[OSS]
# Alibaba Cloud OSS for indexes created with storage_type = "oss", e.g. endpoint "oss-cn-hangzhou.aliyuncs.com".
zed_oss_endpoint = ""
zed_oss_bucket = ""
zed_oss_region = ""
zed_oss_access_key_id = ""
zed_oss_secret_access_key = ""

[Plugin.GSE]
zed_plugin_gse_enable = false
zed_plugin_gse_enable_stop = true
zed_plugin_gse_enable_hmm = true
zed_plugin_gse_dict_embed = "small"
zed_plugin_gse_dict_path = "./plugins/gse/dict"
